services:
  - type: web
    name: novoseminovo-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @novoseminovo/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /listings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novoseminovo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Depois de publicar o site no Vercel, troque pela URL/domínio
      # real dele — sem isso o CORS bloqueia o front de falar com a API.
      - key: WEB_ORIGIN
        value: "https://troque-por-sua-url.vercel.app"

databases:
  - name: novoseminovo-db
    plan: free
    databaseName: novoseminovo
    user: novoseminovo
