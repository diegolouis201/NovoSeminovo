services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: novoseminovo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: novoseminovo
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://novoseminovo:${POSTGRES_PASSWORD}@postgres:5432/novoseminovo?schema=public
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      # Vazias por padrão: sem isso, cada integração cai sozinha pro modo
      # simulado de sempre (ver PaymentsService/EmailService) — preencha no
      # .env quando tiver as chaves de verdade.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_HUMAN_WHATSAPP: ${AGENT_HUMAN_WHATSAPP:-5531936187896}
      AGENT_DAILY_MESSAGE_LIMIT: ${AGENT_DAILY_MESSAGE_LIMIT:-3000}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-}
      # Arquiteto NovoSeminovo: imagens da reforma (Google Gemini) e links de afiliado
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      ARCHITECT_DAILY_IMAGES: ${ARCHITECT_DAILY_IMAGES:-5}
      AUTO_MODERATION_DISABLED: ${AUTO_MODERATION_DISABLED:-}
      # Agentes da operação (ver docs/agentes-ia.md)
      AGENT_DAILY_BUDGET_BRL: ${AGENT_DAILY_BUDGET_BRL:-15}
      AI_USD_BRL: ${AI_USD_BRL:-}
      OPERATIONS_DISABLED: ${OPERATIONS_DISABLED:-}
      OPS_AGENTS_DISABLED: ${OPS_AGENTS_DISABLED:-}
      OPS_MAX_MESSAGES_PER_DAY: ${OPS_MAX_MESSAGES_PER_DAY:-30}
      # Google Analytics e Instagram pelo Windsor.ai (só leitura)
      WINDSOR_API_KEY: ${WINDSOR_API_KEY:-}
      AFFILIATE_AMAZON_TAG: ${AFFILIATE_AMAZON_TAG:-}
      AFFILIATE_MAGALU_STORE: ${AFFILIATE_MAGALU_STORE:-}
      AFFILIATE_MERCADOLIVRE_QUERY: ${AFFILIATE_MERCADOLIVRE_QUERY:-}
      AFFILIATE_LEROYMERLIN_QUERY: ${AFFILIATE_LEROYMERLIN_QUERY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Marketing (/admin/marketing): publicação no Instagram, e-mails em massa e links
      PUBLIC_API_URL: https://api.${DOMAIN}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID:-}
      INSTAGRAM_GRAPH_HOST: ${INSTAGRAM_GRAPH_HOST:-graph.facebook.com}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-v23.0}
      EMAIL_DAILY_LIMIT: ${EMAIL_DAILY_LIMIT:-80}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-diego.louis@novoseminovo.com.br}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      MARKETING_LINK_SECRET: ${MARKETING_LINK_SECRET:-}
      # Push do app do celular (notifications/push.service.ts, mobile/README.md)
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      # Credihome (financiamento imobiliário, /admin/financiamentos)
      CREDIHOME_LOGIN: ${CREDIHOME_LOGIN:-}
      CREDIHOME_PASSWORD: ${CREDIHOME_PASSWORD:-}
      CREDIHOME_PARTNER_ID: ${CREDIHOME_PARTNER_ID:-}
      CREDIHOME_API_URL: ${CREDIHOME_API_URL:-https://api-partner.credihome.com.br/v1/production}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      # Sem isso, foto enviada sumiria a cada "docker compose up --build"
      # (ver common/storage.ts) — só dispensável se configurar S3_BUCKET.
      - uploads_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${DOMAIN}
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      MAPTILER_KEY: ${MAPTILER_KEY:-}
      MAPTILER_STYLE: ${MAPTILER_STYLE:-}
      # App do celular: links do site abrindo no app (mobile/README.md).
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
