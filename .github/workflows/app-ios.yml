# Gera o app de iPhone (mobile/) num Mac do GitHub. Sem as chaves da Apple,
# só confere se o projeto compila (simulador). Com elas, assina e envia a
# versão para o App Store Connect (aparece no TestFlight).
# Segredos (ver mobile/README.md): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_BASE64 (chave .p8 da API do App Store Connect, papel App Manager).
# Mac no GitHub gasta minutos 10x mais rápido: por isso só roda quando
# alguém aperta "Run workflow" (Actions → App iPhone).
name: App iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile

      - name: Compila (sem assinatura)
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        if: env.ASC_KEY_BASE64 == ''
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Assina e envia para o TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: env.ASC_KEY_BASE64 != ''
        working-directory: mobile/ios/App
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_BASE64" | base64 -d > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
